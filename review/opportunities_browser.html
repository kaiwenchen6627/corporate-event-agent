<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Opportunities — Corporate Event Agent</title>
<style>
  :root { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#57606a;
          --blue:#0969da; --green:#1a7f37; --red:#cf222e; --amber:#9a6700; --purple:#8250df; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif; background:var(--bg); color:var(--text);
         display:flex; height:100vh; overflow:hidden; }
  aside { width:360px; min-width:360px; border-right:1px solid var(--line); background:var(--card);
          display:flex; flex-direction:column; }
  aside header { padding:14px 16px; border-bottom:1px solid var(--line); }
  aside header h1 { font-size:15px; }
  aside header .sub { font-size:11px; color:var(--muted); margin-top:3px; }
  .new-opportunity { margin-top:12px; width:100%; }
  #list { overflow-y:auto; flex:1; }
  .section-title { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase;
                   letter-spacing:.04em; padding:12px 16px 6px; }
  .opp { padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .opp:hover { background:#f3f4f6; }
  .opp.active { background:#eaefff; border-left:3px solid var(--blue); padding-left:13px; }
  .opp .row1 { display:flex; align-items:center; gap:8px; }
  .opp .name { font-weight:600; font-size:13px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:10px; font-weight:600; padding:2px 7px; border-radius:10px; }
  .b-discovery { background:#fff8c5; color:var(--amber); }
  .b-solution { background:#ddf4ff; color:var(--blue); }
  .b-collaboration { background:#fbefff; color:var(--purple); }
  .b-won { background:#dafbe1; color:var(--green); }
  .b-lost { background:#ffebe9; color:var(--red); }
  .opp .meta { font-size:11px; color:var(--muted); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { flex:1; overflow-y:auto; padding:24px 32px; }
  .empty { color:var(--muted); font-size:13px; padding:40px; text-align:center; }
  h2 { font-size:17px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .kv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; margin:16px 0; }
  .kv { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .kv .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .kv .v { font-size:13px; margin-top:3px; word-break:break-word; }
  .kv .src { font-size:10px; color:var(--muted); margin-top:4px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:18px; }
  .panel h3 { font-size:13px; margin-bottom:10px; color:var(--muted); }
  .msg { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #eaeef2; }
  .msg:last-child { border-bottom:none; }
  .msg .who { font-size:10px; font-weight:700; min-width:44px; padding-top:2px; }
  .who.customer { color:var(--blue); } .who.agent { color:var(--green); }
  .msg .body { font-size:12.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .msg .at { font-size:10px; color:var(--muted); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0 4px; }
  button { font-size:12px; padding:7px 14px; border-radius:6px; border:1px solid var(--line);
           background:var(--card); cursor:pointer; font-weight:600; }
  button:hover { background:#f3f4f6; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.primary:hover { background:#0860c4; }
  button.won { background:var(--green); border-color:var(--green); color:#fff; }
  button.won:hover { background:#116329; }
  button.lost { background:var(--card); border-color:var(--red); color:var(--red); }
  button.lost:hover { background:#ffebe9; }
  a.button { display:inline-block; font-size:12px; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  a.button:hover { background:#f3f4f6; }
  select { font-size:12px; padding:6px 8px; border-radius:6px; border:1px solid var(--line); }
  .hint { font-size:11px; color:var(--muted); }
  .case-note { background:#fff8c5; border:1px solid #d4a72c; border-radius:8px; padding:10px 14px;
               font-size:12.5px; margin-top:10px; }
  .case-note a { color:var(--blue); font-weight:600; }
  .decision-box { background:#f0fdf4; border:1px solid var(--green); border-radius:8px; padding:10px 14px; font-size:12.5px; margin-top:10px; }
  .reply-draft { background:#fffaf0; border:1px solid #f1c46a; }
  .reply-draft textarea { width:100%; min-height:160px; padding:10px; border:1px solid var(--line); border-radius:7px; font:12.5px/1.55 -apple-system,'PingFang SC','Segoe UI',sans-serif; resize:vertical; box-sizing:border-box; }
  .reply-draft .feedback-note { min-height:58px; margin-top:8px; }
  .learning-result { background:#eff6ff; border:1px solid #93c5fd; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-top:10px; }
  .ai-alert { background:#fff4e5; border:1px solid #e5a93d; color:#7a4b00; border-radius:8px; padding:10px 14px; font-size:12.5px; margin-top:10px; }
  .inbound textarea { width:100%; min-height:130px; padding:10px; border:1px solid var(--line); border-radius:7px; font:12.5px/1.55 -apple-system,'PingFang SC','Segoe UI',sans-serif; resize:vertical; }
  .inbound .row { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-backdrop.show { display:flex; }
  .modal { background:var(--card); border-radius:12px; padding:20px; max-width:640px; width:90%; max-height:80vh; overflow:auto; box-shadow:0 12px 40px rgba(0,0,0,0.2); }
  .modal h3 { margin:0 0 10px; font-size:14px; }
  .modal label { display:block; font-size:11.5px; color:var(--muted); margin:10px 0 4px; }
  .modal textarea { width:100%; min-height:90px; font-family:var(--font-mono); font-size:12px; padding:8px; border:1px solid var(--line); border-radius:6px; box-sizing:border-box; resize:vertical; }
  .modal .ai-draft { background:var(--bg); padding:10px; border-radius:6px; max-height:180px; overflow:auto; font-family:var(--font-mono); font-size:11.5px; white-space:pre-wrap; border:1px solid var(--line); }
  .modal .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .flash { position:fixed; bottom:18px; right:18px; background:#1f2328; color:#fff; font-size:12.5px;
           padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .25s; }
  .flash.show { opacity:.95; }
</style>
</head>
<body>
<aside>
  <header>
    <h1 id="pageHeading"></h1>
    <div class="sub" id="pageSub"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <a class="button" id="knowledgeNav" style="flex:1;text-align:center;text-decoration:none" href="/knowledge/review"></a>
      <button id="langToggle" type="button">EN</button>
    </div>
    <button class="primary new-opportunity" id="newOppButton" onclick="openNewOpp()"></button>
  </header>
  <div id="list"></div>
</aside>
<main id="detail"><div class="empty" id="emptyDetail"></div></main>
<div class="flash" id="flash"></div>
<div class="modal-backdrop" id="reflectModal" onclick="if(event.target===this)closeReflect()">
  <div class="modal">
    <h3 data-i18n="reflectTitle"></h3>
    <label data-i18n="aiDraftReadonly"></label>
    <div class="ai-draft" id="reflectAiDraft"></div>
    <label data-i18n="humanRevision"></label>
    <textarea id="reflectHuman" data-i18n-placeholder="humanRevisionPlaceholder"></textarea>
    <label data-i18n="feedbackNotes"></label>
    <textarea id="reflectNote" data-i18n-placeholder="feedbackNotesPlaceholder" style="min-height:50px"></textarea>
    <div class="modal-actions">
      <button onclick="closeReflect()" data-i18n="cancel"></button>
      <button class="primary" id="reflectSubmit" onclick="submitReflect()"></button>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="newOppModal" onclick="if(event.target===this)closeNewOpp()">
  <div class="modal">
    <h3 data-i18n="newOpportunity"></h3>
    <label data-i18n="customerEmail"></label>
    <input id="newOppEmail" type="email" placeholder="customer@example.com" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font-size:12px;box-sizing:border-box;">
    <label data-i18n="firstEmail"></label>
    <textarea id="newOppText" data-i18n-placeholder="firstEmailPlaceholder" style="min-height:180px"></textarea>
    <div class="modal-actions">
      <button onclick="closeNewOpp()" data-i18n="cancel"></button>
      <button class="primary" id="createOppSubmit" onclick="submitNewOpp()"></button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I18N={
 zh:{pageTitle:'机会管理 — Corporate Event Agent',pageHeading:'机会管理',pageSub:'结案 → 蒸馏成案例 → ',knowledgeApproval:'知识库',knowledge:'知识库',newOpportunityButton:'＋ 新建商机',emptyDetail:'← 选择一个机会',
  reflectTitle:'提交反馈（AI 自动总结为通用原则）',aiDraftReadonly:'AI 原稿（只读）',humanRevision:'人工改后的版本',humanRevisionPlaceholder:'把你想发给客户的版本粘贴在这里……',feedbackNotes:'本次反馈的要点（可选）',feedbackNotesPlaceholder:'这次主要改了语气 / 报价 / 服务范围 / 客户类型……',cancel:'取消',submitReflection:'提交并让 AI 总结',newOpportunity:'新建商机',customerEmail:'客户邮箱（可选）',firstEmail:'客户第一封邮件',firstEmailPlaceholder:'把客户的新询价邮件粘贴到这里……',createAndProcess:'创建并处理',
  stageDiscovery:'洽谈中',stageSolution:'方案期',stageCollaboration:'已批方案',stageClosed:'已完结',won:'成交',lost:'丢单',people:'人',noRequirements:'（尚无需求信息）',activeOpportunities:'活跃机会',closedOpportunities:'已完结',none:'无',empty:'（空）',noConversation:'（无对话）',customer:'客户',team:'Agent',approvePlan:'批准方案',insufficient:'信息未齐 / 无方案 —— 仍可直接结案',submitFeedback:'💡 提交反馈',closeWon:'✓ 成交结案',closeLost:'✗ 丢单结案',closeHint:'结案会把本机会直接存为历史案例（AI 起草 insights，其余字段来自 state）',

  planApproved:'方案已批准（mode → collaboration）',failed:'失败：',pasteEmailFirst:'请先粘贴客户邮件',agentProcessing:'Agent 处理中…',llmFailed:'⚠️ AI 调用失败，系统已提示并可能使用 fallback',sameEvent:'邮件已收到，等待确认是否属于本机会',emailProcessed:'邮件已处理，状态和草稿已更新',processingFailed:'处理失败：',replyRequired:'回复内容不能为空',confirming:'确认中…',feedbackSavedToPrinciples:'本次已直接记录到 principles',viewKnowledge:'查看知识库',replyConfirmedFeedback:'回复已确认，修改和反馈已归纳为邮件原则',replyConfirmedReflectionFailed:'⚠️ 回复已确认；邮件反馈已保存，但 Reflection 失败：',replyConfirmed:'回复已确认并加入对话时间线',confirmFailed:'确认失败：',pasteFirstEmail:'请先粘贴客户第一封邮件',creating:'创建中…',newOpportunityCreated:'新商机已创建，Agent 已完成首轮处理',createFailed:'创建失败：',lostReason:'丢单原因（将写入 outcome.note，也是一条高价值教训）：',wonNote:'成交备注（可选）：',lostReasonRequired:'丢单需要填原因',confirmClose:'确认结案（{result}）？将直接写入历史案例。',alreadyClosed:'该机会已完结过',caseSaved:'已结案，案例 {id} 已写入案例库（insights {n} 条）',selectOpportunity:'请先选择一个机会',noDraft:'本机会尚无 AI 草稿可反馈（需先走完至少一轮回复）',readDraftFailed:'读取草稿失败：',humanVersionRequired:'请填写人工改后的版本',summarizing:'AI 总结中…',reflectionDone:'已总结 {n} 条，{m} 条新原则已写入知识库',submitAndSummarize:'提交并让 AI 总结'},
 en:{pageTitle:'Opportunities — Corporate Event Agent',pageHeading:'Opportunities',pageSub:'Close → Save as a case → ',knowledgeApproval:'Knowledge Base',knowledge:'Knowledge Base',newOpportunityButton:'＋ New opportunity',emptyDetail:'← Select an opportunity',
  reflectTitle:'Submit feedback (AI will distill reusable principles)',aiDraftReadonly:'AI draft (read-only)',humanRevision:'Your edited version',humanRevisionPlaceholder:'Paste the version you would send to the customer…',feedbackNotes:'Feedback notes (optional)',feedbackNotesPlaceholder:'What changed—tone, pricing, service scope, customer type…',cancel:'Cancel',submitReflection:'Submit for AI reflection',newOpportunity:'New opportunity',customerEmail:'Customer email (optional)',firstEmail:'Customer’s first email',firstEmailPlaceholder:'Paste the customer’s initial inquiry here…',createAndProcess:'Create and process',
  stageDiscovery:'Discovery',stageSolution:'Solution',stageCollaboration:'Plan approved',stageClosed:'Closed',won:'Won',lost:'Lost',people:' people',noRequirements:'(No requirement details yet)',activeOpportunities:'Active opportunities',closedOpportunities:'Closed',none:'None',empty:'(Empty)',noConversation:'(No conversation)',customer:'Customer',team:'Agent',approvePlan:'Approve plan',insufficient:'Not enough information / no options — you can still close this opportunity',submitFeedback:'💡 Submit feedback',closeWon:'✓ Mark as won',closeLost:'✗ Mark as lost',closeHint:'Closing saves this opportunity directly as a historical case (AI drafts insights; other fields come from state)',
  closedAs:'Closed as',distilledCase:'Saved to case library: ',approvedPlan:'Approved plan: ',scope:'Scope: ',unknownError:'Unknown error',aiError:'⚠️ An AI error occurred during this run',fallbackWarning:'Some results may use fallback logic. Please review before sending.',replyDraft:'AI reply draft (awaiting review)',feedbackOptionalExample:'Optional feedback: e.g. use a more concise tone, avoid “delighted”, confirm price before asking a question…',confirmAddConversation:'Confirm and add to conversation',confirmHint:'Your edits are saved, and reusable email principles are recorded for immediate use.',pasteNewEmail:'Paste a new customer email',latestEmailPlaceholder:'Paste the customer’s latest email here…',processEmail:'Process email',processHint:'The Agent adds it as the next message, updates requirements and gaps, and drafts a reply.',closingActions:'Close opportunity',requirements:'Requirements',conversationTimeline:'Conversation timeline',turns:'messages',
  planApproved:'Plan approved (mode → collaboration)',failed:'Failed: ',pasteEmailFirst:'Paste the customer email first',agentProcessing:'Agent is processing…',llmFailed:'⚠️ AI call failed; the system may have used fallback logic',sameEvent:'Email received; confirm whether it belongs to this opportunity',emailProcessed:'Email processed; state and draft updated',processingFailed:'Processing failed: ',replyRequired:'Reply cannot be empty',confirming:'Confirming…',feedbackSavedToPrinciples:'Recorded in principles',viewKnowledge:'View Knowledge Base',replyConfirmedFeedback:'Reply confirmed; edits were saved as reusable email principles',replyConfirmedReflectionFailed:'⚠️ Reply confirmed; email feedback was saved, but reflection failed: ',replyConfirmed:'Reply confirmed and added to the conversation',confirmFailed:'Confirmation failed: ',pasteFirstEmail:'Paste the customer’s first email first',creating:'Creating…',newOpportunityCreated:'Opportunity created; the Agent completed its first pass',createFailed:'Creation failed: ',lostReason:'Reason for loss (saved in outcome.note as a useful lesson):',wonNote:'Won note (optional):',lostReasonRequired:'Please provide a reason for marking this as lost',confirmClose:'Close this opportunity as {result}? It will be saved directly to historical cases.',alreadyClosed:'This opportunity is already closed',caseSaved:'Closed and saved case {id} to the case library ({n} insights)',selectOpportunity:'Select an opportunity first',noDraft:'There is no AI draft to give feedback on yet (process at least one reply first)',readDraftFailed:'Could not load draft: ',humanVersionRequired:'Enter your edited version',summarizing:'AI is reflecting…',reflectionDone:'Summarized {n} lesson(s); added {m} new principle(s) to the Knowledge Base',submitAndSummarize:'Submit for AI reflection'}
};
let lang=localStorage.getItem('gatherly_language')||'zh';if(!['zh','en'].includes(lang))lang='zh';
const t=(key,vars={})=>((I18N[lang]||I18N.zh)[key]||I18N.zh[key]||key).replace(/\{(\w+)\}/g,(_,k)=>vars[k]??'');
const MODE_LABEL={discovery:'stageDiscovery',solution:'stageSolution',collaboration:'stageCollaboration',closed:'stageClosed'};
let opps=[],current=null,currentOpp=null;
function applyLanguage(next){lang=next;localStorage.setItem('gatherly_language',lang);document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t('pageTitle');$('#pageHeading').textContent=t('pageHeading');$('#pageSub').innerHTML=t('pageSub')+`<a href="/knowledge/review" target="_blank">${t('knowledgeApproval')}</a>`;$('#knowledgeNav').textContent=t('knowledge');$('#newOppButton').textContent=t('newOpportunityButton');$('#langToggle').textContent=lang==='zh'?'EN':'中文';$('#emptyDetail').textContent=t('emptyDetail');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=t(el.dataset.i18nPlaceholder));$('#reflectSubmit').textContent=t('submitReflection');$('#createOppSubmit').textContent=t('createAndProcess');renderList();if(currentOpp)renderDetail(currentOpp)}
$('#langToggle').onclick=()=>applyLanguage(lang==='zh'?'en':'zh');
window.addEventListener('storage',e=>{if(e.key==='gatherly_language'&&e.newValue&&e.newValue!==lang)applyLanguage(e.newValue)});

function flash(msg){ const f=$('#flash'); f.textContent=msg; f.classList.add('show'); setTimeout(()=>f.classList.remove('show'),2600); }

async function api(path, opts){
  const r = await fetch(path, opts ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(opts)} : undefined);
  if(!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || r.statusText); }
  return r.json();
}

function badgeFor(o){
  if(o.closed) return `<span class="badge b-${o.closed.outcome}">${t(o.closed.outcome==='won'?'won':'lost')}</span>`;
  return `<span class="badge b-${esc(o.mode||'discovery')}">${MODE_LABEL[o.mode]?t(MODE_LABEL[o.mode]):esc(o.mode)}</span>`;
}

function reqLine(o){
  const r = o.requirements||{}, g=k=>r[k]&&r[k].value!=null?String(r[k].value):null;
  return [g('pax')?g('pax')+t('people'):null, g('event_date'), g('service')||g('event_type')].filter(Boolean).join(' · ') || t('noRequirements');
}

function renderList(){
  const active = opps.filter(o=>!o.closed), closed = opps.filter(o=>o.closed);
  const card = o => `
    <div class="opp ${current===o.id?'active':''}" data-oid="${esc(o.id)}">
      <div class="row1"><span class="name">${esc((o.customer||{}).company || (o.customer||{}).contact_email || o.id)}</span>${badgeFor(o)}</div>
      <div class="meta">${esc(reqLine(o))}</div>
      <div class="meta">${esc((o.updated_at||'').slice(0,16).replace('T',' '))}</div>
    </div>`;
  $('#list').innerHTML = `
    <div class="section-title">${t('activeOpportunities')} (${active.length})</div>
    ${active.map(card).join('') || `<div class="empty" style="padding:16px">${t('none')}</div>`}
    ${closed.length?`<div class="section-title">${t('closedOpportunities')} (${closed.length})</div>${closed.map(card).join('')}`:''}`;
  document.querySelectorAll('.opp').forEach(el=>el.onclick=()=>select(el.dataset.oid));
}

function kv(label, value, sub){
  return `<div class="kv"><div class="k">${esc(label)}</div><div class="v">${esc(value)}</div>${sub?`<div class="src">${esc(sub)}</div>`:''}</div>`;
}

function renderDetail(o){
  const r = o.requirements || {};
  const reqCards = Object.entries(r).map(([k,v])=>kv(k, v.value, v.source)).join('') || `<div class="hint">${t('empty')}</div>`;
  const cust = o.customer || {};
  const conv = (o.conversation||[]).map(m=>`
    <div class="msg">
      <div class="who ${m.role}">${m.role==='customer'?t('customer'):t('team')}</div>
      <div><div class="body">${esc(m.text)}</div><div class="at">${esc((m.at||'').slice(0,16).replace('T',' '))}${m.action?' · '+esc(m.action):''}</div></div>
    </div>`).join('') || `<div class="hint">${t('noConversation')}</div>`;

  const options = (o.solution||{}).options || [];
  let actionsHtml = '';
  if(!o.closed){
    const optSel = options.length
      ? `<select id="optSel">${options.map(x=>`<option value="${esc(x.id)}" ${x.recommended?'selected':''}>${esc(x.id)} · ${esc(x.name)} · $${x.price}</option>`).join('')}</select>
         <button class="primary" onclick="approveOpp()">${t('approvePlan')}</button>`
      : `<span class="hint">${t('insufficient')}</span>`;
    actionsHtml = `
      <div class="actions">${optSel}
        <button onclick="openReflect()">${t('submitFeedback')}</button>
        <button class="won" onclick="closeOpp('won')">${t('closeWon')}</button>
        <button class="lost" onclick="closeOpp('lost')">${t('closeLost')}</button>
      </div>
      <div class="hint">${t('closeHint')}</div>`;
  } else {
    const c = o.closed;
    actionsHtml = `
      <div class="decision-box" style="${c.outcome==='lost'?'background:#ffebe9;border-color:var(--red)':''}">
        <b>${t(c.outcome==='won'?'won':'lost')}</b>${c.note?` — ${esc(c.note)}`:''}
        ${c.distilled_case_id?`<br>${t('distilledCase')}<code>${esc(c.distilled_case_id)}</code>`:''}
      </div>`;
  }
  let decisionHtml = '';
  if(o.decision){
    const d = o.decision;
    decisionHtml = `<div class="decision-box">${t('approvedPlan')}<b>${esc(d.name)}</b> · $${esc(d.price)}<br>${t('scope')}${esc((d.scope||[]).join('、'))}</div>`;
  }
  const llmWarnings = (o.llm_warnings||[]).map(w=>`<li><b>${esc(w.stage||'AI')}</b>: ${esc(w.error||t('unknownError'))}</li>`).join('');
  const warningHtml = llmWarnings ? `<div class="ai-alert"><b>${t('aiError')}</b><ul>${llmWarnings}</ul><div>${t('fallbackWarning')}</div></div>` : '';

  $('#detail').innerHTML = `
    <h2>${esc(cust.company || cust.contact_email || o.id)} ${badgeFor(o)}
      <span class="hint">${esc(o.id)}</span></h2>
    <div class="hint" style="margin-top:4px">${esc(cust.contact_person||'')}${cust.role?' · '+esc(cust.role):''}${cust.contact_email?' · '+esc(cust.contact_email):''}</div>
    ${warningHtml}
    ${decisionHtml}
    ${o.pending_reply ? `<div class="panel reply-draft"><h3>${t('replyDraft')}</h3><textarea id="pendingReplyText">${esc(o.pending_reply.draft||'')}</textarea><textarea id="replyFeedbackNote" class="feedback-note" placeholder="${t('feedbackOptionalExample')}"></textarea><div class="row"><button class="primary" onclick="sendPendingReply()">${t('confirmAddConversation')}</button><span class="hint">${t('confirmHint')}</span></div></div>` : ''}
    ${!o.closed ? `<div class="panel inbound"><h3>${t('pasteNewEmail')}</h3><textarea id="incomingEmail" placeholder="${t('latestEmailPlaceholder')}"></textarea><div class="row"><button class="primary" onclick="submitIncoming()">${t('processEmail')}</button><span class="hint">${t('processHint')}</span></div></div>` : ''}
    <div class="panel"><h3>${t('closingActions')}</h3>${actionsHtml}</div>
    <div class="panel"><h3>${t('requirements')}</h3><div class="kv-grid">${reqCards}</div></div>
    <div class="panel"><h3>${t('conversationTimeline')} (${(o.conversation||[]).length} ${t('turns')})</h3>${conv}</div>`;
}

async function select(oid){
  current = oid;
  const o = await api('/opportunities/'+oid);
  currentOpp=o;
  renderDetail(o); renderList();
}

async function approveOpp(){
  try{
    await api(`/opportunities/${current}/approve`, {option_id: $('#optSel').value});
    flash(t('planApproved')); await select(current);
  }catch(e){ flash(t('failed')+e.message); }
}

async function submitIncoming(){
  const box = $('#incomingEmail');
  const text = (box && box.value || '').trim();
  if(!text){ flash(t('pasteEmailFirst')); return; }
  const btn = box.parentElement.querySelector('button');
  btn.disabled = true; btn.textContent = t('agentProcessing');
  try{
    const r = await api('/messages', {text, opportunity_id: current});
    if(r.llm_warnings && r.llm_warnings.length) flash(t('llmFailed'));
    else flash(r.action === 'human_review_same_event' ? t('sameEvent') : t('emailProcessed'));
    await select(current);
  }catch(e){ flash(t('processingFailed')+e.message); }
  finally{ btn.disabled = false; btn.textContent = t('processEmail'); }
}

async function sendPendingReply(){
  const box = $('#pendingReplyText');
  const text = (box && box.value || '').trim();
  if(!text){ flash(t('replyRequired')); return; }
  const btn = box.parentElement.querySelector('button');
  btn.disabled = true; btn.textContent = t('confirming');
  try{
    const note = ($('#replyFeedbackNote') && $('#replyFeedbackNote').value || '').trim();
    const r = await api(`/opportunities/${current}/reply`, {text, note});
    if(r.reflection && !r.reflection.error){
      const principles = (r.reflection.principles || []).map(p=>`<li>${esc(p.text||'')}</li>`).join('');
      if(principles){
        const panel = document.createElement('div');
        panel.className = 'learning-result';
        panel.innerHTML = `<b>${t('feedbackSavedToPrinciples')}</b><ul>${principles}</ul><a href="/knowledge/review" target="_blank">${t('viewKnowledge')}</a>`;
        $('#detail').prepend(panel);
      }
      flash(t('replyConfirmedFeedback'));
    } else if(r.reflection && r.reflection.error) flash(t('replyConfirmedReflectionFailed')+r.reflection.error);
    else flash(t('replyConfirmed'));
    await select(current);
  }catch(e){ flash(t('confirmFailed')+e.message); }
  finally{ btn.disabled = false; btn.textContent = t('confirmAddConversation'); }
}

function openNewOpp(){
  $('#newOppEmail').value = '';
  $('#newOppText').value = '';
  $('#newOppModal').classList.add('show');
  setTimeout(()=>$('#newOppText').focus(), 0);
}

function closeNewOpp(){ $('#newOppModal').classList.remove('show'); }

async function submitNewOpp(){
  const text = ($('#newOppText').value || '').trim();
  const from_email = ($('#newOppEmail').value || '').trim();
  if(!text){ flash(t('pasteFirstEmail')); return; }
  const btn = document.querySelector('#newOppModal button.primary');
  btn.disabled = true; btn.textContent = t('creating');
  try{
    const r = await api('/messages', {text, from_email, new_opportunity:true});
    const oid = r.opportunity && r.opportunity.id;
    closeNewOpp();
    await refresh();
    if(oid) await select(oid);
    flash(t('newOpportunityCreated'));
  }catch(e){ flash(t('createFailed')+e.message); }
  finally{ btn.disabled = false; btn.textContent = t('createAndProcess'); }
}

async function closeOpp(outcome){
  const note = outcome==='lost'
    ? (prompt(t('lostReason'))||'').trim()
    : (prompt(t('wonNote'))||'').trim();
  if(outcome==='lost' && !note){ flash(t('lostReasonRequired')); return; }
  if(!confirm(t('confirmClose',{result:t(outcome==='won'?'won':'lost')}))) return;
  try{
    const r = await api(`/opportunities/${current}/close`, {outcome, note});
    if(r.already_closed){ flash(t('alreadyClosed')); return; }
    flash(t('caseSaved',{id:r.case.id,n:r.case.reusable_insights.length}));
    await refresh();
    await select(current);
  }catch(e){ flash(t('failed')+e.message); }
}

async function openReflect(){
  if(!current){ flash(t('selectOpportunity')); return; }
  try{
    const o = await api('/opportunities/'+current);
    const proposalBody = (o.proposal||{}).body || '';
    const lastAgentMsg = [...(o.conversation||[])].reverse().find(m => m.role==='agent');
    const draft = proposalBody || (lastAgentMsg ? lastAgentMsg.text : '');
    if(!draft){ flash(t('noDraft')); return; }
    $('#reflectAiDraft').textContent = draft;
    $('#reflectHuman').value = draft;
    $('#reflectNote').value = '';
    $('#reflectModal').classList.add('show');
  }catch(e){ flash(t('readDraftFailed')+e.message); }
}

function closeReflect(){ $('#reflectModal').classList.remove('show'); }

async function submitReflect(){
  const human_output = $('#reflectHuman').value.trim();
  const note = $('#reflectNote').value.trim();
  if(!human_output){ flash(t('humanVersionRequired')); return; }
  const btn = event.target; btn.disabled = true; btn.textContent = t('summarizing');
  try{
    const r = await api(`/opportunities/${current}/reflect`, {human_output, note});
    const counts = r.principles_created;
    flash(t('reflectionDone',{n:r.lessons_appended,m:counts}));
    closeReflect();
    await select(current);
  }catch(e){ flash(t('failed')+e.message); }
  finally{ btn.disabled = false; btn.textContent = t('submitReflection'); }
}

async function refresh(){
  opps = (await api('/opportunities')).sort((a,b)=>(b.updated_at||'').localeCompare(a.updated_at||''));
  renderList();
}
applyLanguage(lang);
refresh();
</script>
</body>
</html>
