<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gatherly · Knowledge Base</title>
<style>
:root{
  --bg:#f3f5f3; --card:#ffffff; --line:#dde5e0; --ink:#22302d; --ink-2:#5f7269;
  --accent:#2f6655; --accent-soft:#e7f0ec; --gold:#a8842c; --coral:#b5543c;
  --blue:#3d6a8f; --mono:'DM Mono','SF Mono',Menlo,monospace;
  --sans:'DM Sans',-apple-system,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-size:17px}
header .sub{color:var(--ink-2);font-size:12.5px}
header .spacer{flex:1}
.hbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;font-family:var(--sans);color:var(--ink)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.layout{flex:1;display:grid;grid-template-columns:240px 300px 1fr;min-height:0}
/* ---- sidebar ---- */
aside{border-right:1px solid var(--line);background:var(--card);overflow-y:auto;padding:14px 12px}
.coll{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.coll:hover{background:var(--accent-soft)}
.coll.active{background:var(--accent);color:#fff}
.coll .dot{width:7px;height:7px;border-radius:50%}
.coll b{flex:1;font-weight:500}
.coll small{opacity:.65;font-family:var(--mono)}
.side-label{font-size:11px;letter-spacing:.12em;color:var(--ink-2);margin:14px 12px 6px}
/* ---- record list ---- */
.listpane{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fafbfa}
.searchbar{padding:10px 12px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:13px;background:#fff}
#recordList{flex:1;overflow-y:auto;padding:8px}
.rec{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;border:1px solid transparent}
.rec:hover{background:var(--card);border-color:var(--line)}
.rec.sel{background:var(--card);border-color:var(--accent)}
.rec .t{font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .m{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:11.5px;font-family:var(--mono)}
.badge{font-size:10.5px;padding:1.5px 7px;border-radius:20px;font-family:var(--sans)}
.facet-chip{display:inline-block;background:#eef2f0;color:#40574d;border-radius:14px;padding:2px 8px;font-size:11px;margin:3px 4px 0 0}
.empty{color:var(--ink-2);text-align:center;padding:40px 20px;font-size:13px}
/* ---- editor ---- */
main{overflow-y:auto;padding:20px 24px;min-width:0}
.editor-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.editor-head h2{font-size:19px;font-weight:700}
.editor-head .meta{color:var(--ink-2);font-size:12px;font-family:var(--mono);margin-top:5px;word-break:break-all}
.editor-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:13px;letter-spacing:.08em;color:var(--ink-2);margin-bottom:12px;font-weight:600}
.field{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.field label{font-size:12.5px;color:var(--ink-2)}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:13px;width:100%}
textarea#contentBox{width:100%;min-height:420px;padding:14px;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:12.5px;line-height:1.65;background:#fbfcfb;resize:vertical;white-space:pre;overflow-x:auto}
textarea#contentBox:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.err{color:var(--coral);font-size:12px;margin-top:8px;font-family:var(--mono);white-space:pre-wrap}
.ok{color:var(--accent);font-size:12px;margin-top:8px}
.btnrow{display:flex;gap:8px;margin-top:12px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:13px;font-family:var(--sans)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--coral);border-color:#ecd2cb}
.btn:disabled{opacity:.5;cursor:not-allowed}
pre.raw{white-space:pre-wrap;background:#f7faf7;border:1px solid var(--line);border-radius:10px;padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;max-height:600px;overflow:auto}
.hint{font-size:12px;color:var(--ink-2);margin-left:auto}
/* structured form editor */
.modetoggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;background:#fff}
.modetoggle button{border:0;background:#fff;padding:7px 16px;cursor:pointer;font-size:13px;font-family:var(--sans);color:var(--ink-2)}
.modetoggle button.on{background:var(--accent);color:#fff}
.card.hero{border-color:var(--accent);box-shadow:0 2px 10px rgba(47,102,85,.12)}
.card.hero h3{color:var(--accent)}
.subhead{font-size:12px;color:var(--ink-2);font-weight:600;margin:10px 0 6px;letter-spacing:.05em}
.itemrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.itemrow input.itext{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:13px}
.itemrow .x{border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:15px;line-height:1;padding:4px 6px;border-radius:6px}
.itemrow .x:hover{color:var(--coral);background:#f7e4df}
.btn.addbtn{border-style:dashed;color:var(--ink-2);padding:6px 12px;font-size:12.5px}
.tl{border-left:2px solid var(--line);padding-left:14px}
.tl .turn{margin-bottom:12px}
.tl .who{font-weight:600;font-size:12px;margin-bottom:2px}
.tl .who.cust{color:var(--blue)}
.tl .who.co{color:var(--accent)}
.tl .sum{font-size:13px;line-height:1.55}
.tl .dec{font-size:12px;color:var(--accent);margin-top:3px}
.tl .unres{font-size:12px;color:var(--gold);margin-top:3px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">g</span> gatherly <span class="sub" id="pageSubtitle"></span></div>
  <div class="spacer"></div>
  <a class="hbtn" id="oppNav" style="text-decoration:none;display:inline-block" href="/opportunities/review"></a>
  <button class="hbtn" id="langToggle" type="button">EN</button>
  <button class="hbtn" id="newBtn"></button>
</header>

<div class="layout">
  <aside id="collections"></aside>

  <section class="listpane">
    <div class="searchbar"><input id="filterBox" data-i18n-placeholder="filterCollection"></div>
    <div id="recordList"></div>
  </section>

  <main id="editorPane"><div class="empty" id="emptyEditor"></div></main>
</div>
<div id="toast"></div>

<script>
const COLLECTIONS=[
  {key:'historical_cases',label:'historicalCases',color:'#2f6655'},
  {key:'capabilities',label:'capabilities',color:'#3d6a8f'},
  {key:'principles',label:'salesPrinciples',color:'#b5543c'},
  {key:'feedback',label:'emailFeedback',color:'#8b5cf6'},
  {key:'sources',label:'rawSources',color:'#5f7269'},
];
let state={collection:'historical_cases',records:[],selected:null,counts:{},editMode:'form'};
const $=s=>document.querySelector(s);
const I18N={
  zh:{pageTitle:'知识库管理 · Gatherly',pageSubtitle:'知识库管理',opportunities:'机会管理',newRecord:'＋ 新建记录',filterCollection:'筛选当前集合…',
    historicalCases:'历史案例',capabilities:'能力知识',salesPrinciples:'销售原则',emailFeedback:'邮件反馈',rawSources:'原始来源',collections:'知识集合',
    chooseRecord:'← 选择一条记录查看和编辑',emptyCollection:'此集合暂无记录',unnamed:'未命名记录',delete:'删除',basicInfo:'基本信息',title:'标题',tags:'标签',tagPlaceholder:'逗号分隔',topic:'主题分类',stages:'适用阶段',scope:'适用边界',
    structuredForm:'结构化表单',rawJson:'原始 JSON',confirmDelete:'确定删除记录 {id}？此操作不可恢复。',deleted:'已删除',deleteFailed:'删除失败：',
    jsonCaseLabel:'内容（JSON 模式 · 含 source_message_ids 等溯源字段）',saved:'已保存 ',saveFailed:'保存失败：',invalidJson:'✕ JSON 解析失败：',jsonValid:'✓ JSON 格式正确',content:'内容',saveChanges:'保存修改',textHint:'只显示和编辑这条知识的文本内容',fullRecordJson:'内容（完整记录，JSON）',contentJson:'内容（content 字段，JSON）',formatValidate:'格式化 / 校验',fileHint:'保存后直接写入 data/knowledge/ 下对应 JSON 文件',
    noFields:'（暂无字段，可添加）',addField:'＋ 添加字段',empty:'（暂无）',add:'＋ 添加',deleteItem:'删除此项',conversation:'沟通过程（只读 · 来自原始邮件）',turn:'第{n}轮',customer:'客户',company:'我方',customerInfo:'客户信息',initialReq:'初始需求',finalSolution:'最终方案',commercialState:'商业状态',operationalState:'运营状态',outcome:'结果（outcome）',result:'结果',outcomePlaceholder:'如：活动顺利完成，客户复购',requirementChanges:'需求变更',commitmentsTodos:'承诺与待办',ourCommitments:'我方承诺',customerCommitments:'客户承诺',pendingItems:'待闭环事项',reusableLessons:'可复用经验',traceHint:'保存时 source_message_ids 等溯源字段自动保留 · 写入 data/knowledge/ 对应文件',newFieldPrompt:'新字段名（英文，例如 venue）：',
    rawSource:'原始来源 · ',metadata:'元数据',rawReadonly:'原始内容（只读）',sourceCreateHint:'原始来源由导入流程创建，不手动新建',newRecordTitle:'新记录',created:'已创建 ',createFailed:'创建失败：',noSources:'原始来源由导入流程创建，不手动新建'},
  en:{pageTitle:'Knowledge Base · Gatherly',pageSubtitle:'Knowledge Base',opportunities:'Opportunities',newRecord:'＋ New record',filterCollection:'Filter this collection…',
    historicalCases:'Historical Cases',capabilities:'Capabilities',salesPrinciples:'Sales Principles',emailFeedback:'Email Feedback',rawSources:'Raw Sources',collections:'Collections',
    chooseRecord:'← Select a record to view and edit',emptyCollection:'No records in this collection',unnamed:'Untitled record',delete:'Delete',basicInfo:'BASIC INFORMATION',title:'Title',tags:'Tags',tagPlaceholder:'Comma-separated',topic:'Topic',stages:'Sales stages',scope:'Applicability',
    structuredForm:'Structured form',rawJson:'Raw JSON',confirmDelete:'Delete record {id}? This cannot be undone.',deleted:'Deleted',deleteFailed:'Delete failed: ',
    jsonCaseLabel:'Content (JSON mode · includes source_message_ids and other provenance)',saved:'Saved ',saveFailed:'Save failed: ',invalidJson:'✕ Invalid JSON: ',jsonValid:'✓ Valid JSON',content:'CONTENT',saveChanges:'Save changes',textHint:'View and edit the text of this knowledge record',fullRecordJson:'Content (full record, JSON)',contentJson:'Content (content field, JSON)',formatValidate:'Format / validate',fileHint:'Saves directly to the corresponding JSON file under data/knowledge/',
    noFields:'(No fields yet; you can add one)',addField:'＋ Add field',empty:'(None)',add:'＋ Add',deleteItem:'Delete this item',conversation:'Conversation (read-only · from original email)',turn:'Turn {n}',customer:'Customer',company:'Our team',customerInfo:'Customer information',initialReq:'Initial requirements',finalSolution:'Final solution',commercialState:'Commercial state',operationalState:'Operational state',outcome:'Outcome',result:'Outcome',outcomePlaceholder:'e.g. Event completed successfully; customer returned',requirementChanges:'Requirement changes',commitmentsTodos:'Commitments and follow-ups',ourCommitments:'Our commitments',customerCommitments:'Customer commitments',pendingItems:'Open follow-ups',reusableLessons:'Reusable lessons',traceHint:'Provenance fields such as source_message_ids are preserved when saved · Stored under data/knowledge/',newFieldPrompt:'New field name (English, e.g. venue):',
    rawSource:'Raw source · ',metadata:'METADATA',rawReadonly:'Original content (read-only)',sourceCreateHint:'Raw sources are created through the import flow',newRecordTitle:'New record',created:'Created ',createFailed:'Create failed: ',noSources:'Raw sources are created through the import flow'},
};
let lang=localStorage.getItem('gatherly_language')||'zh';if(!['zh','en'].includes(lang))lang='zh';
function t(key,vars={}){let s=(I18N[lang]||I18N.zh)[key]??I18N.zh[key]??key;return s.replace(/\{(\w+)\}/g,(_,k)=>vars[k]??'')}
function setLanguage(next){lang=next;localStorage.setItem('gatherly_language',lang);document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.title=t('pageTitle');$('#pageSubtitle').textContent=t('pageSubtitle');$('#oppNav').textContent=t('opportunities');$('#newBtn').textContent=t('newRecord');$('#langToggle').textContent=lang==='zh'?'EN':'中文';$('#filterBox').placeholder=t('filterCollection');$('#emptyEditor').textContent=t('chooseRecord');renderSidebar();renderList();if(state.selected)renderEditor(currentRecord())}
$('#langToggle').onclick=()=>setLanguage(lang==='zh'?'en':'zh');
window.addEventListener('storage',e=>{if(e.key==='gatherly_language'&&e.newValue&&e.newValue!==lang)setLanguage(e.newValue)});

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
async function api(path,opts){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}

/* ---------- sidebar ---------- */
function renderSidebar(){
  $('#collections').innerHTML='<div class="side-label">'+t('collections')+'</div>'+COLLECTIONS.map(c=>`
    <div class="coll ${state.collection===c.key?'active':''}" data-key="${c.key}">
      <span class="dot" style="background:${c.color}"></span><b>${t(c.label)}</b><small>${state.counts[c.key]??'–'}</small>
    </div>`).join('');
  document.querySelectorAll('.coll').forEach(el=>el.onclick=()=>{state.collection=el.dataset.key;state.selected=null;loadRecords()});
}

/* ---------- record list ---------- */
function renderList(){
  const kw=$('#filterBox').value.trim().toLowerCase();
  let items=state.records;
  if(kw)items=items.filter(r=>JSON.stringify(r).toLowerCase().includes(kw));
  $('#recordList').innerHTML=items.map(r=>{
    const title=r.title||r.name||(r.content&&r.content.text)||r.id;
    return `<div class="rec ${state.selected===r.id?'sel':''}" data-id="${r.id}">
      <div class="t">${esc(title)}</div>
      <div class="m"><span>${r.id}</span></div>
      ${r.topic_label?`<div><span class="facet-chip">${esc(r.topic_label)}</span></div>`:''}
    </div>`;
  }).join('')||`<div class="empty">${t('emptyCollection')}</div>`;
  document.querySelectorAll('.rec').forEach(el=>el.onclick=()=>openRecord(el.dataset.id));
}
function openRecord(id){
  state.selected=id; renderList();
  const r=state.records.find(x=>x.id===id);
  renderEditor(r||null);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ---------- editor ---------- */
function currentRecord(){return state.records.find(x=>x.id===state.selected)}
function renderEditor(r){
  if(!r){$('#editorPane').innerHTML=`<div class="empty">${t('chooseRecord')}</div>`;return}
  if(state.collection==='sources')return renderSource(r);
  const tags=(r.tags||[]).join(', ');
  const isCase=state.collection==='historical_cases';
  const isTextRecord=state.collection==='capabilities' || state.collection==='principles';
  $('#editorPane').innerHTML=`
    <div class="editor-head">
      <div><h2>${esc(r.title||r.name||t('unnamed'))}</h2>
        <div class="meta">${r.id} · created ${esc(r.created_at||'')}</div></div>
      <div class="actions"><button class="btn danger" id="delBtn">${t('delete')}</button></div>
    </div>
    <div class="card"><h3>${t('basicInfo')}</h3>
      <div class="field"><label>${t('title')}</label><input id="titleBox" value="${esc(r.title||'')}"></div>
      <div class="field"><label>${t('tags')}</label><input id="tagBox" value="${esc(tags)}" placeholder="${t('tagPlaceholder')}"></div>
      ${r.primary_topic?`<div class="field"><label>${t('topic')}</label><div><span class="facet-chip">${esc(r.topic_label||r.primary_topic)}</span><span class="facet-chip">${esc(r.primary_topic)}</span></div></div>`:''}
      ${Array.isArray(r.sales_stages)?`<div class="field"><label>${t('stages')}</label><div>${r.sales_stages.map(x=>`<span class="facet-chip">${esc(x)}</span>`).join('')}</div></div>`:''}
      ${r.applicability?`<div class="field"><label>${t('scope')}</label><div><span class="facet-chip">${esc(r.applicability)}</span><span class="facet-chip">${esc(r.activation_status||'')}</span></div></div>`:''}
    </div>
    ${isCase?`<div class="modetoggle">
      <button id="modeForm" class="${state.editMode!=='json'?'on':''}">${t('structuredForm')}</button>
      <button id="modeJson" class="${state.editMode==='json'?'on':''}">${t('rawJson')}</button></div>`:''}
    <div id="contentArea"></div>`;
  $('#delBtn').onclick=async()=>{
    if(!confirm(t('confirmDelete',{id:r.id})))return;
    try{await api('/knowledge/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:state.collection,id:r.id})});toast(t('deleted'));state.selected=null;await refresh()}catch(e){toast(t('deleteFailed')+e.message)}};
  if(isCase){
    $('#modeForm').onclick=()=>{state.editMode='form';renderEditor(currentRecord())};
    $('#modeJson').onclick=()=>{state.editMode='json';renderEditor(currentRecord())};
    state.editMode==='json'?renderJsonArea(r,t('jsonCaseLabel')):renderCaseForm(r);
  }else if(isTextRecord) renderTextArea(r);
  else renderJsonArea(r);
}

/* ---------- shared save ---------- */
async function saveRecord(r,content){
  const flatRecord = state.collection==='principles' || state.collection==='feedback';
  const record=flatRecord ? {...r,...content} : {...r,content};
  record.title=$('#titleBox').value.trim()||r.title;
  record.tags=$('#tagBox').value.split(',').map(s=>s.trim()).filter(Boolean);
  // Identity and storage metadata are controlled by the store, not the JSON editor.
  for(const k of ['id','collection','created_at']) record[k]=r[k];
  if(flatRecord) delete record.content;
  try{const saved=await api('/knowledge/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:state.collection,record})});
    toast(t('saved')+saved.id);await refresh(saved.id)}
  catch(e){const eb=$('#errBox');if(eb){eb.className='err';eb.textContent=t('saveFailed')+e.message}else toast(t('saveFailed')+e.message)}
}
function tryParse(){try{const v=JSON.parse($('#contentBox').value);$('#errBox').textContent='';return v}catch(e){$('#errBox').className='err';$('#errBox').textContent=t('invalidJson')+e.message;return undefined}}

async function saveTextRecord(r,text){
  const record={...r,
    title:$('#titleBox').value.trim()||r.title,
    tags:$('#tagBox').value.split(',').map(s=>s.trim()).filter(Boolean)};
  // Capabilities imported from older seed data use notes; newer records and
  // principles use text. Preserve the existing field so editing never moves
  // the sentence into an unrelated JSON content object.
  const field = Object.prototype.hasOwnProperty.call(r,'text') ? 'text' : 'notes';
  record[field]=text.trim();
  delete record.content;
  try{
    const saved=await api('/knowledge/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:state.collection,record})});
    toast(t('saved')+saved.id); await refresh(saved.id);
  }catch(e){toast(t('saveFailed')+e.message)}
}

function renderTextArea(r){
  const field = Object.prototype.hasOwnProperty.call(r,'text') ? 'text' : 'notes';
  const value = r[field] || '';
  $('#contentArea').innerHTML=`
    <div class="card"><h3>${t('content')}</h3>
      <textarea id="textContentBox" style="width:100%;min-height:180px;padding:14px;border:1px solid var(--line);border-radius:10px;font-family:var(--sans);font-size:14px;line-height:1.65;resize:vertical">${esc(value)}</textarea>
      <div class="btnrow">
        <button class="btn primary" id="saveTextBtn">${t('saveChanges')}</button>
        <span class="hint">${t('textHint')}</span>
      </div>
    </div>`;
  $('#saveTextBtn').onclick=async()=>saveTextRecord(r,$('#textContentBox').value);
}

/* ---------- raw JSON editor ---------- */
function renderJsonArea(r,label){
  const flatRecord = state.collection==='principles' || state.collection==='feedback';
  const value = flatRecord ? r : (r.content??{});
  $('#contentArea').innerHTML=`
    <div class="card"><h3>${label||(flatRecord?t('fullRecordJson'):t('contentJson'))}</h3>
      <textarea id="contentBox" spellcheck="false">${esc(JSON.stringify(value,null,2))}</textarea>
      <div class="btnrow">
        <button class="btn primary" id="saveBtn">${t('saveChanges')}</button>
        <button class="btn" id="fmtBtn">${t('formatValidate')}</button>
        <span class="hint">${t('fileHint')}</span>
      </div>
      <div class="err" id="errBox"></div>
    </div>`;
  $('#fmtBtn').onclick=()=>{const v=tryParse();if(v!==undefined){$('#contentBox').value=JSON.stringify(v,null,2);$('#errBox').className='ok';$('#errBox').textContent=t('jsonValid')}};
  $('#saveBtn').onclick=async()=>{const v=tryParse();if(v===undefined)return;await saveRecord(r,v)};
}

/* ---------- structured case form ---------- */
const META_KEYS={source_message_ids:1,source_message_id:1,source_lines:1};
function kvRows(key,obj){
  const rows=Object.entries(obj||{}).filter(([k])=>!META_KEYS[k]).map(([k,v])=>{
    const t=typeof v,ot=(v!==null&&t==='object')?'json':t;
    return `<div class="field"><label>${esc(k)}</label>
      <input data-kv="${key}" data-k="${esc(k)}" data-origtype="${ot}" value="${esc(ot==='json'?JSON.stringify(v):String(v))}"></div>`;
  }).join('');
  return rows||`<div class="empty" style="padding:8px 0">${t('noFields')}</div>`;
}
function kvCard(title,key,obj,hero){
  const meta=Object.fromEntries(Object.entries(obj||{}).filter(([k])=>META_KEYS[k]));
  return `<div class="card ${hero?'hero':''}"><h3>${title}</h3>${kvRows(key,obj)}
    <input type="hidden" data-kvmeta="${key}" value="${esc(JSON.stringify(meta))}">
    <div class="btnrow"><button class="btn addbtn" type="button" data-addkv="${key}">${t('addField')}</button></div></div>`;
}
/* 自动探测列表项的文本字段名（应对 LLM 提取结构漂移：commitment/item/insight...；pending 可能是纯字符串或 dict） */
function listBlock(key,items){
  const f=(items||[]).find(x=>x!==null&&x!==undefined&&x!=='');
  const plain=typeof f!=='object';
  const tk=(f&&typeof f==='object')?Object.keys(f).find(k=>!META_KEYS[k])||'text':'text';
  const rows=(items||[]).filter(x=>x!==null&&x!==undefined&&x!=='').map(it=>{
    const isStr=typeof it==='string';
    const text=isStr?it:(it[tk]??'');
    const extra=isStr?'':JSON.stringify(Object.fromEntries(Object.entries(it).filter(([k])=>k!==tk)));
    return `<div class="itemrow" data-itemrow="${key}"${plain?' data-plain="1"':''} data-tk="${esc(tk)}"${extra?` data-extra="${esc(extra)}"`:''}>
      <input class="itext" value="${esc(String(text))}" placeholder="${esc(tk)}">
      <button class="x" type="button" data-rm title="${t('deleteItem')}">✕</button></div>`;
  }).join('')||`<div class="empty" style="padding:8px 0">${t('empty')}</div>`;
  return rows+`
  <button class="btn addbtn" type="button" data-additem="${key}"${plain?' data-plain="1"':''} data-tk="${esc(tk)}">${t('add')}</button>`;
}
function timelineCard(r){
  const tl=(r.extraction&&r.extraction.timeline)||[];
  if(!tl.length)return '';
  return `<div class="card"><h3>${t('conversation')}</h3><div class="tl">
    ${tl.map(t=>`<div class="turn">
      <div class="who ${t.speaker==='customer'?'cust':'co'}">${I18N[lang].turn.replace('{n}',t.turn)} · ${t.speaker==='customer'?I18N[lang].customer:I18N[lang].company}</div>
      <div class="sum">${esc(t.summary||'')}</div>
      ${(t.decisions||[]).map(d=>`<div class="dec">✓ ${esc(d)}</div>`).join('')}
      ${(t.unresolved_items||[]).map(u=>`<div class="unres">? ${esc(u)}</div>`).join('')}
    </div>`).join('')}
  </div></div>`;
}
function renderCaseForm(r){
  const c=r.content||{},cm=c.commitments||{};
  $('#contentArea').innerHTML=`
    ${kvCard(t('customerInfo'),'customer',c.customer)}
    ${kvCard(t('initialReq'),'initial_requirement',c.initial_requirement)}
    ${kvCard(t('finalSolution'),'final_solution',c.final_solution,true)}
    ${kvCard(t('commercialState'),'commercial_state',c.commercial_state)}
    ${kvCard(t('operationalState'),'operational_state',c.operational_state)}
    <div class="card"><h3>${t('outcome')}</h3>
      <div class="field"><label>${t('result')}</label><input id="outcomeBox" value="${esc(c.outcome===null||c.outcome===undefined?'':String(c.outcome))}" placeholder="${t('outcomePlaceholder')}"></div>
    </div>
    <div class="card"><h3>${t('requirementChanges')}</h3>${listBlock('reqch',c.requirement_changes)}</div>
    <div class="card"><h3>${t('commitmentsTodos')}</h3>
      <div class="subhead">${t('ourCommitments')}</div>${listBlock('cmco',cm.company)}
      <div class="subhead">${t('customerCommitments')}</div>${listBlock('cmcu',cm.customer)}
      <div class="subhead">${t('pendingItems')}</div>${listBlock('cmpd',cm.pending)}
    </div>
    <div class="card"><h3>${t('reusableLessons')}</h3>${listBlock('ins',c.reusable_insights)}</div>
    ${timelineCard(r)}
    <div class="card"><div class="btnrow">
      <button class="btn primary" id="saveBtn">${t('saveChanges')}</button>
      <span class="hint">${t('traceHint')}</span>
    </div><div class="err" id="errBox"></div></div>`;
  $('#contentArea').addEventListener('click',onContentClick);
  $('#saveBtn').onclick=async()=>{await saveRecord(r,collectCaseContent(r))};
}
function onContentClick(e){
  const rm=e.target.closest('[data-rm]');
  if(rm){rm.closest('.itemrow').remove();return}
  const ai=e.target.closest('[data-additem]');
  if(ai){
    const row=document.createElement('div');row.className='itemrow';row.dataset.itemrow=ai.dataset.additem;
    if(ai.dataset.plain==='1')row.dataset.plain='1';
    if(ai.dataset.tk)row.dataset.tk=ai.dataset.tk;
    row.innerHTML=`<input class="itext" placeholder="${esc(ai.dataset.tk||t('content'))}"><button class="x" type="button" data-rm title="${t('deleteItem')}">✕</button>`;
    ai.parentElement.insertBefore(row,ai);row.querySelector('input').focus();return;
  }
  const ak=e.target.closest('[data-addkv]');
  if(ak){
    const k=prompt(t('newFieldPrompt'));if(!k)return;
    const f=document.createElement('div');f.className='field';
    f.innerHTML=`<label>${esc(k)}</label><input data-kv="${ak.dataset.addkv}" data-k="${esc(k)}" data-origtype="string">`;
    ak.closest('.card').insertBefore(f,ak.closest('.btnrow'));
    f.querySelector('input').focus();
  }
}
function coerce(v,t){
  if(t==='boolean')return v==='true';
  if(t==='number'){const n=Number(v);return isNaN(n)?v:n}
  if(t==='json'){try{return JSON.parse(v)}catch(e){return v}}
  return v;
}
function collectKV(key){
  const out={};
  document.querySelectorAll(`input[data-kv="${key}"]`).forEach(el=>{
    const k=el.dataset.k.trim();if(!k)return;
    out[k]=coerce(el.value,el.dataset.origtype);
  });
  const meta=document.querySelector(`input[data-kvmeta="${key}"]`);
  if(meta){try{Object.assign(out,JSON.parse(meta.value)||{})}catch(e){}}
  return out;
}
function collectItems(key){
  return [...document.querySelectorAll(`[data-itemrow="${key}"]`)].map(row=>{
    const t=row.querySelector('.itext').value.trim();
    if(!t)return null;
    if(row.dataset.plain==='1')return t;
    const o={[row.dataset.tk||'text']:t};
    if(row.dataset.extra)Object.assign(o,JSON.parse(row.dataset.extra));
    return o;
  }).filter(Boolean);
}
function collectCaseContent(r){
  const c=JSON.parse(JSON.stringify(r.content||{}));
  ['customer','initial_requirement','current_requirement','final_solution','commercial_state','operational_state']
    .forEach(k=>{if(document.querySelector(`input[data-kv="${k}"]`))c[k]=collectKV(k)});
  const oc=$('#outcomeBox');if(oc!==null)c.outcome=oc.value.trim()||null;
  c.requirement_changes=collectItems('reqch');
  c.commitments={company:collectItems('cmco'),customer:collectItems('cmcu'),pending:collectItems('cmpd')};
  c.reusable_insights=collectItems('ins');
  return c;
}

function renderSource(r){
  $('#editorPane').innerHTML=`
    <div class="editor-head"><div><h2>${t('rawSource')}${esc(r.type||'')}</h2>
      <div class="meta">${r.id} · created ${esc(r.created_at||'')}</div></div></div>
    <div class="card"><h3>${t('metadata')}</h3><pre class="raw">${esc(JSON.stringify(r.metadata||{},null,2))}</pre></div>
    <div class="card"><h3>${t('rawReadonly')}</h3><pre class="raw">${esc(r.raw||'')}</pre></div>`;
}

/* ---------- new record ---------- */
$('#newBtn').onclick=async()=>{
  if(state.collection==='sources'){toast(t('sourceCreateHint'));return}
  const record={title:t('newRecordTitle'),tags:[],content:{}};
  try{const saved=await api('/knowledge/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({collection:state.collection,record})});
    toast(t('created')+saved.id);await refresh(saved.id)}
  catch(e){toast(t('createFailed')+e.message)}
};

/* ---------- data loading ---------- */
async function refresh(selectId){
  const counts=await api('/knowledge/collections');state.counts=counts;
  if(selectId)state.selected=selectId;
  await loadRecords(false);renderSidebar();
}
async function loadRecords(rerenderSide=true){
  const key=state.collection;
  state.records=await api('/knowledge/records?collection='+encodeURIComponent(key)).catch(()=>[]);
  if(key==='sources')state.records=await api('/knowledge/sources');
  if(rerenderSide)renderSidebar();
  renderList();
  if(state.selected){const r=state.records.find(x=>x.id===state.selected);renderEditor(r||null)}
  else renderEditor(null);
}
$('#filterBox').oninput=renderList;

setLanguage(lang);
loadRecords();
</script>
</body>
